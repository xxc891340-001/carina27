<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>DepositIQ — 保护你的押金</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand:     '#FFCB37',
            'brand-h': '#E5B320',
            warm:      '#FFF8F0',
          },
          fontFamily: {
            sans: ['"Noto Sans SC"', 'Inter', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            card:  '0 4px 20px rgba(0,0,0,0.08)',
            'card-sm': '0 2px 8px rgba(0,0,0,0.06)',
            brand: '0 4px 20px rgba(255,203,55,0.35)',
          },
        },
      },
    }
  </script>

  <!-- React + Babel (no build step — opens directly on any device) -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* ── Reset tap flash on iOS ── */
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans SC', 'Inter', system-ui, sans-serif;
      background: #FFF8F0;
      -webkit-font-smoothing: antialiased;
      margin: 0;
      padding: 0;
    }

    /* ── Safe areas (iPhone notch / home bar) ── */
    .pt-safe  { padding-top:    max(48px, env(safe-area-inset-top)); }
    .pb-safe  { padding-bottom: max(32px, env(safe-area-inset-bottom)); }

    /* ── Screen entry animation ── */
    @keyframes screenIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .screen-in { animation: screenIn 0.32s cubic-bezier(0.22,1,0.36,1) both; }

    /* ── Staggered children ── */
    .stagger > *:nth-child(1) { animation-delay: 0.00s; }
    .stagger > *:nth-child(2) { animation-delay: 0.07s; }
    .stagger > *:nth-child(3) { animation-delay: 0.14s; }
    .stagger > *:nth-child(4) { animation-delay: 0.21s; }
    .stagger > *:nth-child(5) { animation-delay: 0.28s; }

    /* ── Tap card physical press ── */
    .tap-card {
      transition: transform 0.10s ease, box-shadow 0.10s ease;
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
    }
    .tap-card:active { transform: scale(0.96); }

    /* ── Primary button ── */
    .btn-primary {
      transition: transform 0.10s ease, background-color 0.15s ease;
      cursor: pointer;
    }
    .btn-primary:active {
      transform: scale(0.98);
      background-color: #E5B320;
    }

    /* ── Back button ── */
    .btn-back {
      transition: opacity 0.12s ease;
      cursor: pointer;
    }
    .btn-back:active { opacity: 0.5; }

    /* ── Language chip ── */
    .lang-chip {
      transition: background-color 0.12s ease;
      cursor: pointer;
    }
    .lang-chip:active { background-color: #F3F4F6; }

    /* ── Scenario card selected ring ── */
    .scenario-selected {
      border-color: #FFCB37 !important;
      background-color: #FFFBEB !important;
      box-shadow: 0 4px 20px rgba(255,203,55,0.22) !important;
    }

    /* ── Mobile viewport height optimisation ──
       Tighten vertical gaps on small iPhones (SE, mini) so the CTA
       becomes visible without scrolling. Desktop layout unchanged. */
    @media (max-height: 740px) {
      .vgap-hero   { padding-top:  12px !important; }
      .vgap-badge  { margin-bottom: 10px !important; }
      .vgap-sub    { margin-top:   12px !important; }
      .vgap-props  { margin-top:   14px !important; }
      .vgap-trust  { margin-top:   12px !important; }
      .vgap-cta    { padding-top:  10px !important; }
      .vgap-props .space-y-3 > * + * { margin-top: 8px !important; }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

/* ─────────────────────────────────────────────
   COPY  (zh / en)
───────────────────────────────────────────── */
const copy = {
  zh: {
    brand:       'DepositIQ',
    badge:       '🇬🇧 英国租客专用',
    h1:          '保护你的押金',
    h1sub:       'Protect your deposit',
    sub:         '拍照记录房屋现有状况，自动生成英文报告，发送至你的邮箱留存。',
    subEn:       'Photo evidence → English PDF → sent to your email',
    v1zh:        '拍照记录，时间戳证明',
    v1en:        'Timestamped photo evidence',
    v2zh:        '自动生成英文PDF报告',
    v2en:        'English PDF, generated automatically',
    v3zh:        '照片处理后自动删除',
    v3en:        'Photos deleted after report is sent',
    trustZh:     '"我们不会永久保存你的房间照片。报告生成后，照片将在 7 天内自动删除。"',
    trustEn:     'We do not permanently store your room photos.',
    cta:         '快速记录一下',
    ctaSub:      '£5.99 · 一次性付款 · 生成英文PDF报告',
    scenarioQ:   '今天需要记录什么？',
    scenarioQen: 'What are you recording today?',
    scenarioNote:'四种场景使用相同的简单记录流程',
    scenarioNoteEn: 'All four use the same simple flow',
    back:        '返回',
    scenarios: [
      { id:'move_in',  icon:'🔑', zh:'入住记录', en:'Move-in',  desc:'记录入住当天的房屋状态',        descEn:'Document condition on arrival' },
      { id:'move_out', icon:'📦', zh:'退租记录', en:'Move-out', desc:'搬离前留下清晰证据',            descEn:'Evidence before you leave' },
      { id:'damage',   icon:'⚡', zh:'损坏记录', en:'Damage',   desc:'记录意外或外部原因造成的损坏',  descEn:'Accidental or external damage' },
      { id:'takeover', icon:'🤝', zh:'接手租约', en:'Takeover', desc:'记录接手时已有的状况',          descEn:'Condition at tenancy handover' },
    ],
  },
  en: {
    brand:       'DepositIQ',
    badge:       '🇬🇧 For UK Tenants',
    h1:          'Protect your deposit',
    h1sub:       '保护你的押金',
    sub:         'Record existing issues with photos and generate an English evidence report — sent straight to your email.',
    subEn:       '拍照记录 → 英文PDF报告 → 发送至邮箱',
    v1zh:        'Timestamped photo evidence',
    v1en:        '拍照记录，时间戳证明',
    v2zh:        'English PDF, generated automatically',
    v2en:        '自动生成英文PDF报告',
    v3zh:        'Photos deleted after report is sent',
    v3en:        '照片处理后自动删除',
    trustZh:     '"We do not permanently store your room photos. They are deleted within 7 days of your report being generated."',
    trustEn:     '我们不会永久保存你的房间照片。',
    cta:         'Record Issues',
    ctaSub:      '£5.99 · one-time · English PDF report',
    scenarioQ:   'What are you recording today?',
    scenarioQen: '今天需要记录什么？',
    scenarioNote:'All four scenarios use the same simple recording flow',
    scenarioNoteEn: '四种场景，相同流程',
    back:        'Back',
    scenarios: [
      { id:'move_in',  icon:'🔑', zh:'Move-in',  en:'入住记录', desc:'Document condition on arrival',        descEn:'记录入住当天的房屋状态' },
      { id:'move_out', icon:'📦', zh:'Move-out', en:'退租记录', desc:'Evidence before you leave',            descEn:'搬离前留下清晰证据' },
      { id:'damage',   icon:'⚡', zh:'Damage',   en:'损坏记录', desc:'Accidental or external damage',        descEn:'记录意外或外部原因造成的损坏' },
      { id:'takeover', icon:'🤝', zh:'Takeover', en:'接手租约', desc:'Condition at tenancy handover',        descEn:'记录接手时已有的状况' },
    ],
  },
};

/* ─────────────────────────────────────────────
   SCREEN: HOMEPAGE
───────────────────────────────────────────── */
function HomePage({ lang, onToggleLang, onStart }) {
  const t = copy[lang];

  return (
    <div className="min-h-screen bg-warm flex flex-col max-w-[430px] mx-auto">

      {/* ── Top bar ── */}
      <div className="px-5 pt-safe flex items-center justify-between">
        <div className="flex items-center gap-2 py-4">
          <div className="w-8 h-8 bg-brand rounded-xl flex items-center justify-center shadow-sm flex-shrink-0">
            <span style={{fontFamily:'Inter,sans-serif',fontWeight:700,fontSize:'13px',color:'#000',lineHeight:1}}>D</span>
          </div>
          <span style={{fontWeight:700,fontSize:'14px',color:'#1F2937',letterSpacing:'0.01em'}}>{t.brand}</span>
        </div>
        <button
          onClick={onToggleLang}
          className="lang-chip text-xs text-[#6B7280] border border-[#E5E7EB] rounded-full px-3 py-1.5 bg-white"
          style={{fontFamily:'Inter,sans-serif',fontWeight:500}}
        >
          {lang === 'zh' ? 'EN' : '中文'}
        </button>
      </div>

      {/* ── Hero ── */}
      <div className="flex-1 px-5 pt-6 vgap-hero screen-in stagger">

        {/* Badge */}
        <div
          className="vgap-badge inline-flex items-center gap-1.5 rounded-full px-3 py-1 mb-5"
          style={{background:'rgba(255,203,55,0.15)',border:'1px solid rgba(255,203,55,0.45)'}}
        >
          <span style={{fontSize:'12px',fontWeight:500,color:'#1F2937'}}>{t.badge}</span>
        </div>

        {/* Headline */}
        <div className="screen-in">
          <h1 style={{fontSize:'clamp(28px,8vw,34px)',fontWeight:700,color:'#1F2937',lineHeight:1.18,margin:0}}>
            {t.h1}
          </h1>
          {lang === 'zh' && (
            <p style={{fontSize:'17px',fontWeight:500,color:'#9CA3AF',marginTop:'4px',marginBottom:0}}>
              {t.h1sub}
            </p>
          )}
        </div>

        {/* Subheadline */}
        <div className="mt-5 vgap-sub screen-in">
          <p style={{fontSize:'14px',color:'#6B7280',lineHeight:1.6,margin:0}}>
            {t.sub}
          </p>
          {lang === 'zh' && (
            <p style={{fontSize:'12px',color:'#9CA3AF',marginTop:'4px',margin:0}}>
              {t.subEn}
            </p>
          )}
        </div>

        {/* Value props */}
        <div className="mt-7 vgap-props space-y-3 screen-in">
          {[
            { icon:'📸', zh: t.v1zh, en: t.v1en },
            { icon:'📄', zh: t.v2zh, en: t.v2en },
            { icon:'🔒', zh: t.v3zh, en: t.v3en },
          ].map((v) => (
            <div key={v.zh} className="flex items-center gap-3.5">
              <div
                className="flex-shrink-0 w-10 h-10 bg-white rounded-2xl flex items-center justify-center"
                style={{border:'1px solid #E5E7EB',boxShadow:'0 2px 8px rgba(0,0,0,0.06)'}}
              >
                <span style={{fontSize:'20px'}}>{v.icon}</span>
              </div>
              <div>
                <p style={{fontSize:'13px',fontWeight:600,color:'#1F2937',margin:0}}>{v.zh}</p>
                {lang === 'zh' && (
                  <p style={{fontSize:'11px',color:'#9CA3AF',marginTop:'1px',margin:0}}>{v.en}</p>
                )}
              </div>
            </div>
          ))}
        </div>

        {/* Privacy trust card */}
        <div
          className="mt-6 vgap-trust mb-2 rounded-2xl p-4 screen-in"
          style={{background:'#fff',border:'1px solid #E5E7EB',boxShadow:'0 2px 8px rgba(0,0,0,0.04)'}}
        >
          <p style={{fontSize:'13px',color:'#6B7280',lineHeight:1.65,margin:0}}>
            {t.trustZh}
          </p>
          {lang === 'zh' && (
            <p style={{fontSize:'11px',color:'#9CA3AF',marginTop:'6px',margin:0}}>
              {t.trustEn}
            </p>
          )}
        </div>
      </div>

      {/* ── CTA ── */}
      <div className="px-5 pt-5 pb-safe vgap-cta screen-in">
        <button
          onClick={onStart}
          className="btn-primary w-full bg-brand text-black font-bold rounded-xl py-4"
          style={{
            fontSize:'16px',
            fontWeight:700,
            boxShadow:'0 4px 20px rgba(255,203,55,0.35)',
            border:'none',
            outline:'none',
          }}
        >
          {t.cta} →
        </button>
        <p style={{textAlign:'center',fontSize:'12px',color:'#9CA3AF',marginTop:'10px'}}>
          {t.ctaSub}
        </p>
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────
   SCREEN: SCENARIO SELECTION
───────────────────────────────────────────── */
function ScenarioPage({ lang, onToggleLang, onBack, onSelect }) {
  const t = copy[lang];
  const [selected, setSelected] = useState(null);

  function handleSelect(id) {
    setSelected(id);
    setTimeout(() => onSelect(id), 180);
  }

  return (
    <div className="min-h-screen bg-warm flex flex-col max-w-[430px] mx-auto">

      {/* ── Top bar ── */}
      <div className="px-5 pt-safe flex items-center justify-between">
        <button onClick={onBack} className="btn-back flex items-center gap-1 py-4">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path d="M11.5 14L6.5 9L11.5 4" stroke="#6B7280" strokeWidth="1.6"
              strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
          <span style={{fontSize:'14px',color:'#6B7280',fontWeight:500}}>{t.back}</span>
        </button>
        <button
          onClick={onToggleLang}
          className="lang-chip text-xs text-[#6B7280] border border-[#E5E7EB] rounded-full px-3 py-1.5 bg-white"
          style={{fontFamily:'Inter,sans-serif',fontWeight:500}}
        >
          {lang === 'zh' ? 'EN' : '中文'}
        </button>
      </div>

      {/* ── Question ── */}
      <div className="px-5 pt-2 pb-1 screen-in">
        <h2 style={{fontSize:'clamp(22px,6vw,26px)',fontWeight:700,color:'#1F2937',margin:0,lineHeight:1.2}}>
          {t.scenarioQ}
        </h2>
        {lang === 'zh' && (
          <p style={{fontSize:'13px',color:'#9CA3AF',marginTop:'4px',margin:0}}>
            {t.scenarioQen}
          </p>
        )}
      </div>

      {/* ── Scenario cards — 2×2 grid ── */}
      <div className="flex-1 px-5 pt-5">
        <div className="grid grid-cols-2 gap-3 screen-in stagger">
          {t.scenarios.map((s) => (
            <button
              key={s.id}
              onClick={() => handleSelect(s.id)}
              className={`tap-card text-left bg-white rounded-3xl p-5 flex flex-col gap-3 ${selected === s.id ? 'scenario-selected' : ''}`}
              style={{
                border: selected === s.id ? '2px solid #FFCB37' : '2px solid #E5E7EB',
                boxShadow: selected === s.id
                  ? '0 4px 20px rgba(255,203,55,0.22)'
                  : '0 4px 20px rgba(0,0,0,0.06)',
                outline:'none',
              }}
            >
              <span style={{fontSize:'32px',lineHeight:1}}>{s.icon}</span>
              <div>
                <p style={{fontSize:'15px',fontWeight:700,color:'#1F2937',margin:0,lineHeight:1.2}}>{s.zh}</p>
                {lang === 'zh' && (
                  <p style={{fontSize:'11px',fontWeight:500,color:'#9CA3AF',marginTop:'2px',margin:0}}>{s.en}</p>
                )}
              </div>
              <p style={{fontSize:'12px',color:'#6B7280',lineHeight:1.5,margin:0}}>{s.desc}</p>
            </button>
          ))}
        </div>

        {/* Reassurance note */}
        <div className="mt-6 screen-in" style={{animationDelay:'0.3s'}}>
          <p style={{textAlign:'center',fontSize:'12px',color:'#9CA3AF',lineHeight:1.7,margin:0}}>
            {t.scenarioNote}
            {lang === 'zh' && (
              <><br/><span style={{fontSize:'11px'}}>{t.scenarioNoteEn}</span></>
            )}
          </p>
        </div>
      </div>

      <div className="pb-safe" style={{paddingBottom:'max(32px, env(safe-area-inset-bottom))'}} />
    </div>
  );
}

/* ─────────────────────────────────────────────
   COMING SOON placeholder (next screens)
───────────────────────────────────────────── */
function ComingSoon({ scenario, lang, onBack }) {
  const labels = {
    move_in:  { zh:'入住记录', en:'Move-in' },
    move_out: { zh:'退租记录', en:'Move-out' },
    damage:   { zh:'损坏记录', en:'Damage' },
    takeover: { zh:'接手租约', en:'Takeover' },
  };
  const s = labels[scenario] || {};
  return (
    <div className="min-h-screen bg-warm flex flex-col items-center justify-center max-w-[430px] mx-auto px-8 screen-in">
      <div
        className="w-full rounded-3xl p-8 text-center"
        style={{background:'#fff',border:'2px solid #FFCB37',boxShadow:'0 4px 20px rgba(255,203,55,0.2)'}}
      >
        <p style={{fontSize:'36px',marginBottom:'12px'}}>🏗</p>
        <p style={{fontSize:'15px',fontWeight:700,color:'#1F2937',margin:0}}>
          {lang==='zh' ? `${s.zh} — 下一个屏幕` : `${s.en} — Next screen`}
        </p>
        <p style={{fontSize:'13px',color:'#9CA3AF',marginTop:'8px',lineHeight:1.6}}>
          {lang==='zh'
            ? '房间检查流程即将生成。\n选择场景已记录。'
            : 'Room inspection flow coming next.\nScenario selected successfully.'}
        </p>
      </div>
      <button
        onClick={onBack}
        className="btn-back mt-6"
        style={{fontSize:'14px',color:'#6B7280',fontWeight:500}}
      >
        ← {lang==='zh' ? '返回场景选择' : 'Back to scenarios'}
      </button>
    </div>
  );
}

/* ─────────────────────────────────────────────
   APP SHELL
───────────────────────────────────────────── */
function App() {
  // Locale: auto-detect from browser, fallback to zh
  const detectLang = () => {
    const nav = navigator.language || navigator.userLanguage || 'zh';
    return nav.toLowerCase().startsWith('zh') ? 'zh' : 'en';
  };

  const [lang, setLang]         = useState(detectLang);
  const [screen, setScreen]     = useState('home');
  const [scenario, setScenario] = useState(null);

  const toggleLang = () => setLang(l => l === 'zh' ? 'en' : 'zh');

  if (screen === 'home') return (
    <HomePage
      lang={lang}
      onToggleLang={toggleLang}
      onStart={() => setScreen('scenario')}
    />
  );

  if (screen === 'scenario') return (
    <ScenarioPage
      lang={lang}
      onToggleLang={toggleLang}
      onBack={() => setScreen('home')}
      onSelect={(id) => { setScenario(id); setScreen('coming_soon'); }}
    />
  );

  if (screen === 'coming_soon') return (
    <ComingSoon
      scenario={scenario}
      lang={lang}
      onBack={() => setScreen('scenario')}
    />
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
